[package]
name = "CodeEditer"
version = "2.0.0"
edition = "2021"

[dependencies]
eframe = "0.28"
egui = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syntect = "5.2"
image = { version = "0.25", features = ["ico"] }
directories = "5.0"
discord-rich-presence = "1.1.0"
rfd = "0.14"
tiny_http = "0.12"
open = "5"
ureq = { version = "2.9", features = ["json"] }
sevenz-rust = "0.6"

[build-dependencies]
winres = "0.1"
